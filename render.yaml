services:
  # PayPilot AI – Unified Full-Stack Web Service (FastAPI + React SPA)
  - type: web
    name: paypilot-ai
    runtime: python
    region: oregon
    plan: free
    buildCommand: pip install -r backend/requirements.txt && npm ci && npm run build
    startCommand: cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: SESSION_SECRET
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: DEMO_PASSWORD
        value: Password123!
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_MODE
        value: sandbox
